server {
	listen 8000;
	server_name freight-ev.aspire-computing.com;

	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Cache static assets
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
